      - key: TransportSystem
        semanticId: cssx:Transport
        modelRef:
        - AAS: self
      - key: Product
        semanticId: css:Product
      - key: From
        semanticId: cssx:LocationParameter
      - key: To
        semanticId: cssx:LocationParameter
      - key: DestinationStation
        semanticId: css:CPPM
      Conditions:
        PreConditions:
        - predicate: cssx:Operational
          args:
          - 0
        - predicate: cssx:Occupied
          args:
          - 0
          - 1
        - predicate: cssx:On
          args:
          - 1
          - 0
        - predicate: cssx:ProductAt
          args:
          - 1
          - 2
        - predicate: cssx:ResourceAt
          args:
          - 0
          - 2
        - predicate: cssx:Occupied
          args:
          - 4
          - 1
        - predicate: cssx:StationAt
          args:
          - 4
          - 3
      Effects:
        EndEffects:
        - predicate: cssx:ResourceAt
          args:
          - 0
          - 3
        - predicate: cssx:ProductAt
          args:
          - 1
          - 3
        StartEffects:
        - predicate: cssx:ResourceAt
          args:
          - 0
          - 2
          negated: true
        - predicate: cssx:ProductAt
          args:
          - 1
          - 2
          negated: true
  - key: Halt
    description: Halt the current operation
    semantic_id: cssx:HaltSkill
    InterfaceReference: Halt
  - key: Occupy
    description: Occupy the system for exclusive use
    semantic_id: cssx:OccupySkill
    InterfaceReference: Occupy
    ExecutionModel:
      Parameters:
      - key: TransportSystem
        semanticId: cssx:Transport
        modelRef:
        - AAS: self
      - key: Identifiable
        semanticId: cssx:Identifiable
      Conditions:
        PreConditions:
        - predicate: cssx:Free
          args:
          - 0
        - predicate: cssx:Occupied
          args:
          - 0
          - 1
          negated: true
      Effects:
        EndEffects:
        - predicate: cssx:Occupied
          args:
          - 0
          - 1
        - predicate: cssx:Free
          args:
          - 0
          negated: true
  - key: Release
    description: Release the system from exclusive use
    semantic_id: cssx:ReleaseSkill
    InterfaceReference: Release
    ExecutionModel:
      Parameters:
      - key: TransportSystem
        semanticId: cssx:Transport
        modelRef:
        - AAS: self
      - key: Identifiable
        semanticId: cssx:Identifiable
      Conditions:
        PreConditions:
        - predicate: cssx:Operational
          args:
          - 0
        - predicate: cssx:Occupied
          args:
          - 0
          - 1
      Effects:
        EndEffects:
        - predicate: cssx:Occupied
          args:
          - 0
          - 1
          negated: true
        - predicate: cssx:Free
          args:
          - 0

  ControlComponent:
    GoalSet:
      - predicate: cssx:Operational
        args: ['self']
      - predicate: cssx:Free
        args: ['self']
      - predicate: cssx:At
        args: ['self', 'cssx:HomePosition']
