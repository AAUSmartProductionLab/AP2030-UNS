          output: https://aausmartproductionlab.github.io/AP2030-UNS/MQTTSchemas/commandResponse.schema.json
          forms:
            contentType: application/json
            href: /CMD/XYMotion
            op: invokeAction
            mqv_retain: 'false'
            mqv_controlPacket: subscribe
            mqv_qos: '2'
            response:
              contentType: application/json
              href: /DATA/XYMotion
              mqv_controlPacket: publish
              mqv_retain: 'false'
        - key: Halt
          title: Halt
          synchronous: 'true'
          input: https://aausmartproductionlab.github.io/AP2030-UNS/MQTTSchemas/command.schema.json
          forms:
            contentType: application/json
            href: /CMD/Halt
            op: invokeAction
            mqv_retain: 'false'
            mqv_controlPacket: subscribe
            mqv_qos: '2'
        - key: Occupy
          title: Occupy
          synchronous: 'true'
          input: https://aausmartproductionlab.github.io/AP2030-UNS/MQTTSchemas/command.schema.json
          output: https://aausmartproductionlab.github.io/AP2030-UNS/MQTTSchemas/commandResponse.schema.json
          forms:
            contentType: application/json
            href: /CMD/Occupy
            op: invokeAction
            mqv_retain: 'false'
            mqv_controlPacket: subscribe
            mqv_qos: '2'
            response:
              contentType: application/json
              href: /DATA/Occupy
              mqv_controlPacket: publish
              mqv_retain: 'false'
        - key: Release
          title: Release
          synchronous: 'true'
          input: https://aausmartproductionlab.github.io/AP2030-UNS/MQTTSchemas/command.schema.json
          output: https://aausmartproductionlab.github.io/AP2030-UNS/MQTTSchemas/commandResponse.schema.json
          forms:
            contentType: application/json
            href: /CMD/Release
            op: invokeAction
            mqv_retain: 'false'
            mqv_controlPacket: subscribe
            mqv_qos: '2'
            response:
              contentType: application/json
              href: /DATA/Release
              mqv_controlPacket: publish
              mqv_retain: 'false'
        properties:
        - key: StationState
          title: StationState
          output: https://aausmartproductionlab.github.io/AP2030-UNS/MQTTSchemas/DestinationStationState.schema.json
          forms:
            contentType: application/json
            href: /DATA/State
            mqv_retain: 'true'
            mqv_controlPacket: publish
            mqv_qos: '0'
        - key: ProductID
          title: ProductID
          input: https://aausmartproductionlab.github.io/AP2030-UNS/MQTTSchemas/productId.schema.json
          forms:
            contentType: application/json
            href: /DATA/ProductId
            mqv_retain: 'false'
            mqv_controlPacket: publish
            mqv_qos: '0'
        - key: Location
          title: Location
          output: https://aausmartproductionlab.github.io/AP2030-UNS/MQTTSchemas/positionStamped.schema.json
          forms:
            contentType: application/json
            href: /DATA/Location
            mqv_retain: 'true'
            mqv_controlPacket: publish
            mqv_qos: '0'
  Variables:
  - key: PackMLState
    semanticId: https://w3id.org/2026/apex/semantic/state/operational
    InterfaceReference:
      Name: StationState
      Field: State
  - key: OccupationState
    semanticId: https://w3id.org/2026/apex/semantic/state/occupied
    InterfaceReference:
      Name: StationState
      Field: ProcessQueue
  - key: Location
    semanticId: https://w3id.org/2026/apex/semantic/location/label
    InterfaceReference:
      Name: Location
      Field: Position
  - key: PositionX
    semanticId: https://w3id.org/2026/apex/semantic/position/x
    InterfaceReference:
      Name: Location
      Field: X
  - key: PositionY
    semanticId: https://w3id.org/2026/apex/semantic/position/y
    InterfaceReference:
      Name: Location
      Field: Y
  Parameters:
    ProductID:
      semanticId: cssx:ProductIdentifier
      InterfaceReference: ProductID
    Location:
      semanticId: cssx:InitialLocationParameter
      Position:
        X: 240.0
        Y: 0.0
        Yaw: 0.0
  HierarchicalStructures:
    Name: BillOfMaterials
    Archetype: OneUp
    IsPartOf:
      planarTableAAS:
        globalAssetId: https://smartproductionlab.aau.dk/assets/ZTM1NTAzNzQtMDZkNi00N2Q4LWI1YTktMGNhMmY0MDEyNTk4
