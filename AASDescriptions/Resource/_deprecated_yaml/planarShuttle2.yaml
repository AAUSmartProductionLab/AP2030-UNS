    InterfaceMQTT:
      Title: Planar Motors Shuttle
      EndpointMetadata:
        base: mqtt://192.168.0.104:1883/NN/Nybrovej/InnoLab/Planar/Xbot2
        contentType: application/json
      InteractionMetadata:
        actions:
        - key: MoveToPosition
