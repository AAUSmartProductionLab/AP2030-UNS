imaLoadingSystemAAS:
  idShort: imaLoadingSystemAAS
  id: https://smartproductionlab.aau.dk/aas/imaLoadingSystemAAS
  globalAssetId: https://smartproductionlab.aau.dk/assets/ZDNlYmVhZjItZTAyMC00NWMwLTg5NjEtODRiNTFkOWE0NzVl2
  derivedFrom: https://smartproductionlab.aau.dk/aas/templates/resource
  assetType: http://www.w3id.org/aau-ra/cssx#LoadingSystem
  serialNumber: IMA-LS-2024-001
  location: InnoLab, Nybrovej, AAU
  AssetInterfacesDescription:
    InterfaceMQTT:
      Title: IMA Loading System
      EndpointMetadata:
        base: mqtt://192.168.0.104:1883/NN/Nybrovej/InnoLab/Loading
        contentType: application/json
      InteractionMetadata:
        actions:
        - key: Loading
          title: Loading
          synchronous: 'false'
          input: https://aausmartproductionlab.github.io/AP2030-UNS/MQTTSchemas/command.schema.json
          output: https://aausmartproductionlab.github.io/AP2030-UNS/MQTTSchemas/commandResponse.schema.json
          forms:
            contentType: application/json
            href: /CMD/Loading
            op: invokeAction
            mqv_retain: 'false'
            mqv_controlPacket: subscribe
            mqv_qos: '2'
            response:
              contentType: application/json
              href: /DATA/Loading
              mqv_controlPacket: publish
              mqv_retain: 'false'
        - key: Halt
          title: Halt
          synchronous: 'true'
          input: https://aausmartproductionlab.github.io/AP2030-UNS/MQTTSchemas/command.schema.json
          forms:
            contentType: application/json
            href: /CMD/Halt
            op: invokeAction
            mqv_retain: 'false'
            mqv_controlPacket: subscribe
            mqv_qos: '2'
        - key: Occupy
          title: Occupy
          synchronous: 'true'
          input: https://aausmartproductionlab.github.io/AP2030-UNS/MQTTSchemas/command.schema.json
          output: https://aausmartproductionlab.github.io/AP2030-UNS/MQTTSchemas/commandResponse.schema.json
          forms:
            contentType: application/json
            href: /CMD/Occupy
            op: invokeAction
            mqv_retain: 'false'
            mqv_controlPacket: subscribe
            mqv_qos: '2'
            response:
              contentType: application/json
              href: /DATA/Occupy
              mqv_controlPacket: publish
              mqv_retain: 'false'
        - key: Release
          title: Release
          synchronous: 'true'
          input: https://aausmartproductionlab.github.io/AP2030-UNS/MQTTSchemas/command.schema.json
          output: https://aausmartproductionlab.github.io/AP2030-UNS/MQTTSchemas/commandResponse.schema.json
          forms:
            contentType: application/json
            href: /CMD/Release
            op: invokeAction
            mqv_retain: 'false'
            mqv_controlPacket: subscribe
            mqv_qos: '2'
            response:
              contentType: application/json
              href: /DATA/Release
              mqv_controlPacket: publish
              mqv_retain: 'false'
        properties:
        - key: StationState
          title: StationState
          output: https://aausmartproductionlab.github.io/AP2030-UNS/MQTTSchemas/stationState.schema.json
          forms:
            contentType: application/json
            href: /DATA/State
            mqv_retain: 'true'
            mqv_controlPacket: publish
            mqv_qos: '0'
  Variables:
  - key: PackMLState
    semanticId: https://w3id.org/2026/apex/semantic/state/operational
    InterfaceReference:
      Name: StationState
      Field: State
  - key: OccupationState
    semanticId: https://w3id.org/2026/apex/semantic/state/occupied
    InterfaceReference:
      Name: StationState
      Field: ProcessQueue
  Parameters:
    Location:
      semanticId: https://w3id.org/2026/apex/semantic/location/label
      Position:
        X: 360.0
        Y: 840.0
        Yaw: 270.0
  HierarchicalStructures:
    Name: BillOfMaterials
    Archetype: OneUp
    IsPartOf:
      aauFillingLineAAS:
        globalAssetId: https://smartproductionlab.aau.dk/assets/MWQ2ODY5ZDEtZTQ3Yy00NWU4LTlmYTAtNTI3YjVlMDk4MWFi
  Capabilities:
  - key: Loading
    realizedBy: Loading
    semantic_id: cssx:LoadingCapability
  Skills:
  - key: Loading
    description: Loading function for pharmaceutical primary packaging
    semantic_id: cssx:LoadingSkill
    InterfaceReference: Loading
    ExecutionModel:
      Parameters:
      - key: LoadingSystem
        modelRef:
        - AAS: self
      - key: Product
        semanticId: css:Product
      - key: TransportSystem
        semanticId: cssx:Transport
      - key: LoadingLocation
        modelRef:
        - AAS: self
          Submodel: Parameters
          Element: Location
      Conditions:
        PreConditions:
        - predicate: cssx:Operational
          args:
          - 0
        - predicate: cssx:Occupied
          args:
          - 0
          - 1
        - predicate: cssx:ResourceAt
          args:
          - 2
          - 3
        - predicate: cssx:Empty
          args:
          - 2
      Effects:
        EndEffects:
        - oneOf:
          - when: Outcome = 0
            and:
            - predicate: cssx:On
              args:
              - 1
              - 2
            - predicate: cssx:ProductAt
              args:
              - 1
              - 3
            - not:
              - predicate: cssx:Empty
                args:
                - 2
          - when: Outcome = 1
            not:
            - predicate: cssx:On
              args:
              - 1
              - 2
  - key: Halt
    description: Halt the current operation
    semantic_id: cssx:HaltSkill
    InterfaceReference: Halt
  - key: Occupy
    description: Occupy the system for exclusive use
    semantic_id: cssx:OccupySkill
    InterfaceReference: Occupy
    ExecutionModel:
      Parameters:
      - key: LoadingSystem
        modelRef:
        - AAS: self
      - key: Identifiable
        semanticId: cssx:Identifiable
      Conditions:
        PreConditions:
        - predicate: cssx:Free
          args:
          - 0
        - predicate: cssx:Occupied
          args:
          - 0
          - 1
          negated: true
      Effects:
        EndEffects:
        - predicate: cssx:Occupied
          args:
          - 0
          - 1
        - predicate: cssx:Free
          args:
          - 0
          negated: true
  - key: Release
    description: Release the system from exclusive use
    semantic_id: cssx:ReleaseSkill
    InterfaceReference: Release
    ExecutionModel:
      Parameters:
      - key: LoadingSystem
        modelRef:
        - AAS: self
      - key: Identifiable
        semanticId: cssx:Identifiable
      Conditions:
        PreConditions:
        - predicate: cssx:Operational
          args:
          - 0
        - predicate: cssx:Occupied
          args:
          - 0
          - 1
      Effects:
        EndEffects:
        - predicate: cssx:Occupied
          args:
          - 0
          - 1
          negated: true
        - predicate: cssx:Free
          args:
          - 0

  ControlComponent:
    GoalSet:
      - predicate: cssx:Operational
        args: ['self']
      - predicate: cssx:Free
        args: ['self']
