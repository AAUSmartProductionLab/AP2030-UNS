services:
  aas-env:
    image: eclipsebasyx/aas-environment:${BASYX_VERSION:-2.0.0-SNAPSHOT}
    container_name: aas-env
    environment:
      - SERVER_PORT=8081
      - EXTERNAL_HOST=${EXTERNAL_HOST:-localhost}
      - BASYX_BACKEND=MongoDB
      - BASYX_ENVIRONMENT=file:aas
      - BASYX_CORS_ALLOWED_ORIGINS=*
      - BASYX_CORS_ALLOWED_METHODS=GET,POST,PATCH,DELETE,PUT,OPTIONS,HEAD
      - BASYX_AASREPOSITORY_FEATURE_REGISTRYINTEGRATION=http://aas-registry:8080
      - BASYX_SUBMODELREPOSITORY_FEATURE_REGISTRYINTEGRATION=http://sm-registry:8080
      - BASYX_EXTERNALURL=http://${EXTERNAL_HOST:-localhost}:8081
      - SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=500MB
      - SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=500MB
      - SPRING_DATA_MONGODB_HOST=mongo
      - SPRING_DATA_MONGODB_DATABASE=aas-env
      - SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE=admin
      - SPRING_DATA_MONGODB_USERNAME=mongoAdmin
      - SPRING_DATA_MONGODB_PASSWORD=mongoPassword
      - MQTT_HOSTNAME=hivemq-broker
      - MQTT_PORT=1883
      - MQTT_CLIENTID=aas-env-client
      - BASYX_FEATURE_KAFKA_ENABLED=${BASYX_FEATURE_KAFKA_ENABLED:-false}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS:-}
      - BASYX_AASREPOSITORY_FEATURE_MQTT_ENABLED=false
      - BASYX_SUBMODELREPOSITORY_FEATURE_MQTT_ENABLED=false
      # the submodel-update events (~1.2 MB) exceed the 1 MB producer default
      - SPRING_KAFKA_PRODUCER_PROPERTIES_MAX_REQUEST_SIZE=10485760
      # expire the JVM/netty DNS cache fast: the per-unit DMP containers are
      # recreated (their IPs churn) and the operation delegation must
      # re-resolve dmp-syntegonstopperingsystemaas promptly
      - JAVA_TOOL_OPTIONS=-Dnetworkaddress.cache.ttl=10
    extra_hosts:
      # the operation delegation targets the DMP's host-published REST port
      # (host.docker.internal resolves via the host gateway on Linux)
      - "host.docker.internal:host-gateway"
    volumes:
      - ../aas:/application/aas
    ports:
      - '8081:8081'
    restart: always
    depends_on:
      aas-registry:
        condition: service_healthy
      sm-registry:
        condition: service_healthy
      mongo:
        condition: service_healthy
      hivemq-broker:
        condition: service_started
    networks:
      - hivemq-network
  aas-registry:
    image: eclipsebasyx/aas-registry-log-mongodb:${BASYX_VERSION:-2.0.0-SNAPSHOT}
    container_name: aas-registry
    ports:
      - '8082:8080'
    environment:
      - SERVER_PORT=8080
      - SPRING_DATA_MONGODB_HOST=mongo
      - SPRING_DATA_MONGODB_PORT=27017
      - SPRING_DATA_MONGODB_DATABASE=aas-registry
      - SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE=admin
      - SPRING_DATA_MONGODB_USERNAME=mongoAdmin
      - SPRING_DATA_MONGODB_PASSWORD=mongoPassword
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-}
      - BASYX_CORS_ALLOWED_ORIGINS=*
      - BASYX_CORS_ALLOWED_METHODS=GET,POST,PATCH,DELETE,PUT,OPTIONS,HEAD
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - hivemq-network
  sm-registry:
    image: eclipsebasyx/submodel-registry-log-mongodb:${BASYX_VERSION:-2.0.0-SNAPSHOT}
    container_name: sm-registry
    ports:
      - '8083:8080'
    environment:
      - SERVER_PORT=8080
      - SPRING_DATA_MONGODB_HOST=mongo
      - SPRING_DATA_MONGODB_PORT=27017
      - SPRING_DATA_MONGODB_DATABASE=sm-registry
      - SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE=admin
      - SPRING_DATA_MONGODB_USERNAME=mongoAdmin
      - SPRING_DATA_MONGODB_PASSWORD=mongoPassword
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-}
      - BASYX_CORS_ALLOWED_ORIGINS=*
      - BASYX_CORS_ALLOWED_METHODS=GET,POST,PATCH,DELETE,PUT,OPTIONS,HEAD
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - hivemq-network
  aas-discovery:
    image: eclipsebasyx/aas-discovery:2.0.0-SNAPSHOT
    container_name: aas-discovery
    environment:
      - SERVER_PORT=8081
      - SPRING_APPLICATION_NAME=AAS Discovery Service
      - BASYX_AASDISCOVERYSERVICE_NAME=aas-discovery-service
      - BASYX_BACKEND=MongoDB
      - BASYX_CORS_ALLOWED_ORIGINS=*
      - BASYX_CORS_ALLOWED_METHODS=GET,POST,PATCH,DELETE,PUT,OPTIONS,HEAD
      # This aas-discovery image is the standalone (pre-Spring-Boot-3) build:
      # its bundled application.properties documents the LEGACY
      # `spring.mongodb.*` keys, so the Boot-3 `SPRING_DATA_MONGODB_*` names
      # are silently ignored and the driver falls back to localhost:27017.
      # Symptom: /actuator/health hangs ~30 s and answers 503 DOWN with
      # "MongoHealthIndicator took 30004ms", which also breaks the web UI
      # (AAS_DISCOVERY_PATH -> :8084/lookup/shells). The registries are a
      # different (Boot-3) image family and do need SPRING_DATA_MONGODB_*.
      - SPRING_MONGODB_HOST=mongo
      - SPRING_MONGODB_PORT=27017
      - SPRING_MONGODB_DATABASE=aas-discovery
      - SPRING_MONGODB_AUTHENTICATION_DATABASE=admin
      - SPRING_MONGODB_USERNAME=mongoAdmin
      - SPRING_MONGODB_PASSWORD=mongoPassword
    ports:
      - '8084:8081'
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - hivemq-network
  mongo:
    image: mongo:5.0.10
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoAdmin
      MONGO_INITDB_ROOT_PASSWORD: mongoPassword
    restart: always
    healthcheck:
      test: mongo
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hivemq-network
  aas-web-ui:
    # The AIMC mapping visualization is a user plugin in the Web UI fork
    # (`basyx-aas-web-ui` submodule). The UI resolves plugins from
    # `aas-web-ui/src/UserPlugins/**/*.vue` at BUILD time only, so the plugin
    # has to be compiled into the image rather than mounted at runtime.
    # `Dockerfile.ci` is the fork's own build entry point; upstream's
    # `Dockerfile` is left untouched so the fork merges cleanly.
    # Paths in an included compose file resolve against this file's own
    # directory, hence the leading `../`.
    build:
      context: ../basyx-aas-web-ui/aas-web-ui
      dockerfile: Dockerfile.ci
    image: aas-gui-ap2030:local
    container_name: aas-ui
    ports:
      - '3001:3000'
    environment:
      AAS_REGISTRY_PATH: http://${EXTERNAL_HOST:-localhost}:8082/shell-descriptors
      SUBMODEL_REGISTRY_PATH: http://${EXTERNAL_HOST:-localhost}:8083/submodel-descriptors
      AAS_REPO_PATH: http://${EXTERNAL_HOST:-localhost}:8081/shells
      SUBMODEL_REPO_PATH: http://${EXTERNAL_HOST:-localhost}:8081/submodels
      CD_REPO_PATH: http://${EXTERNAL_HOST:-localhost}:8081/concept-descriptions
      AAS_DISCOVERY_PATH: http://${EXTERNAL_HOST:-localhost}:8084/lookup/shells
      LOGO_PATH: novo-logo.png
      PRIMARY_COLOR: '#000eaa'
      DASHBOARD_SERVICE_PATH: http://${EXTERNAL_HOST:-localhost}:8085/api/elements
      START_PAGE_ROUTE_NAME: "AASEditor"
      # Required for the AIMC transformation editor to persist a saved blob.
      ALLOW_EDITING: 'true'
    volumes:
      - ../logo:/usr/src/app/dist/Logo
    restart: always
    depends_on:
      aas-env:
        condition: service_started
    networks:
      - hivemq-network 
  dashboard-api:
    image: aaronzi/basyx-dashboard-api:SNAPSHOT_02
    container_name: dashboard-api
    environment:
      - SERVER_PORT=8085
      - SPRING_DATA_MONGODB_HOST=mongo
      - SPRING_DATA_MONGODB_DATABASE=aas-dashboard
      - SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE=admin
      - SPRING_DATA_MONGODB_USERNAME=mongoAdmin
      - SPRING_DATA_MONGODB_PASSWORD=mongoPassword
      - BASYX_CORS_ALLOWED_ORIGINS=*
      - BASYX_CORS_ALLOWED_METHODS=GET,POST,PATCH,DELETE,PUT,OPTIONS,HEAD
      - BASYX_EXTERNALURL=http://${EXTERNAL_HOST:-localhost}:8085
    ports:
      - '8085:8085'
    volumes:
      - ../logo:/usr/src/app/dist/Logo
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - hivemq-network
  databridge:
    image: eclipsebasyx/databridge:1.0.0-milestone-08
    container_name: databridge
    # Legacy standalone bridge — superseded by the per-unit DMP containers
    # that dmp-management-node deploys (one per managed AIMC, with their own
    # hashed health port). Off by default: a plain `docker compose up -d`
    # skips it. Opt back in explicitly when testing the legacy path:
    #   docker compose --profile legacy-bridge up -d databridge
    profiles: ["legacy-bridge"]
    # Run as the host user so configs written into the shared mount
    # (../databridge) are owned by the host user — otherwise the container
    # (root) creates root-owned files that the host Registration Service
    # cannot overwrite (PermissionError).
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../databridge:/usr/share/config
    restart: always
    depends_on:
      aas-env:
        condition: service_healthy
      hivemq-broker:
        condition: service_started
    networks:
      - hivemq-network
  