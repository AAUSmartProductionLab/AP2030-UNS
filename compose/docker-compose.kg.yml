services:
  akhq:
    image: tchiotludo/akhq:${KG_AKHQ_VERSION:-0.25.1}
    container_name: kg-akhq
    restart: unless-stopped
    ports:
      - "${KG_AKHQ_PORT:-8086}:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            ap2030-kafka:
              properties:
                bootstrap.servers: "kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - hivemq-network

  fuseki:
    image: stain/jena-fuseki:5.0.0
    container_name: kg-fuseki
    user: "0:0"
    restart: unless-stopped
    ports:
      - "${KG_FUSEKI_PORT:-3030}:3030"
    environment:
      ADMIN_PASSWORD: ${KG_FUSEKI_ADMIN_PASSWORD:-admin}
      JVM_ARGS: -Xmx${KG_FUSEKI_HEAP_MAX:-4G}
    volumes:
      - ../fuseki/databases:/fuseki/databases
      - ../fuseki/configuration:/fuseki/configuration
      - ../ARSO_Ontology_AAS_Generation/Ontology:/staging/arso:ro
      - ../kg-bridge/Ontology:/staging/kg-ontology:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3030/$$/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - hivemq-network

  fuseki-bootstrap:
    image: curlimages/curl:8.7.1
    container_name: kg-fuseki-bootstrap
    depends_on:
      fuseki:
        condition: service_healthy
    environment:
      ADMIN_PASSWORD: ${KG_FUSEKI_ADMIN_PASSWORD:-admin}
      KG_TBOX_GRAPH: ${KG_TBOX_GRAPH:-urn:kg:tbox}
      KG_ABOX_GRAPH: ${KG_ABOX_GRAPH:-urn:kg:abox}
      KG_SHACL_GRAPH: ${KG_SHACL_GRAPH:-urn:kg:shacl}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        BASE=http://kg-fuseki:3030/kg
        TBOX_GRAPH=${KG_TBOX_GRAPH:-urn:kg:tbox}
        ABOX_GRAPH=${KG_ABOX_GRAPH:-urn:kg:abox}
        SHACL_GRAPH=${KG_SHACL_GRAPH:-urn:kg:shacl}

        for f in /staging/arso/AAS/aas-rdf-ontology.ttl \
                 /staging/arso/CSS/CSS-Ontology.ttl \
                 /staging/arso/ARSO/ARSO_AAS.ttl \
                 /staging/arso/ARSO/Modules/aid.ttl \
                 /staging/arso/ARSO/Modules/capabilities.ttl \
                 /staging/arso/ARSO/Modules/control-component.ttl \
                 /staging/arso/ARSO/Modules/hierarchical-structures.ttl \
                 /staging/arso/ARSO/Modules/nameplate.ttl \
                 /staging/arso/ARSO/Modules/operational-data.ttl \
                 /staging/arso/ARSO/Modules/parameters.ttl \
                 /staging/arso/ARSO/Modules/technical-data.ttl \
                 /staging/kg-ontology/arso-extensions.ttl \
                 /staging/kg-ontology/APEX/apex.ttl \
                 /staging/kg-ontology/APEX/apex-predicates.ttl \
                 /staging/kg-ontology/APEX/apex-product-hierarchy.ttl \
                 /staging/kg-ontology/APEX/apex-resource-hierarchy.ttl \
                 /staging/kg-ontology/APEX/apex-pddl.ttl \
                 /staging/kg-ontology/APEX/apex-pddl-2-1.ttl \
                 /staging/kg-ontology/APEX/apex-pddl-plus.ttl \
                 /staging/kg-ontology/APEX/apex-fond.ttl \
                 /staging/kg-ontology/APEX/apex-execution.ttl ; do
          [ -f "$$f" ] || { echo "missing $$f"; continue; }
          echo "Loading TBox $$f"
          curl -fsS -u admin:${ADMIN_PASSWORD:-admin} \
               -X POST -H "Content-Type: text/turtle" \
               --data-binary @$$f \
               "$$BASE/data?graph=$${TBOX_GRAPH}"
        done

        for f in /staging/kg-ontology/APEX/extensions/*.ttl ; do
          [ -f "$$f" ] || continue
          echo "Loading APEX extension $$f"
          curl -fsS -u admin:${ADMIN_PASSWORD:-admin} \
               -X POST -H "Content-Type: text/turtle" \
               --data-binary @$$f \
               "$$BASE/data?graph=$${TBOX_GRAPH}"
        done

        for f in /staging/arso/SHACL/Manual/aas-shacl-schema.ttl \
                 /staging/arso/SHACL/Manual/arso-rules.shacl.ttl \
                 /staging/arso/SHACL/Generated/shapes.generated.shacl.ttl \
                 /staging/kg-ontology/APEX/apex-shacl.ttl ; do
          [ -f "$$f" ] || { echo "missing $$f"; continue; }
          echo "Loading SHACL $$f"
          curl -fsS -u admin:${ADMIN_PASSWORD:-admin} \
               -X POST -H "Content-Type: text/turtle" \
               --data-binary @$$f \
               "$$BASE/data?graph=$${SHACL_GRAPH}"
        done

        deployment_loaded=0
        for f in /staging/kg-ontology/deployment/*.ttl ; do
          [ -f "$$f" ] || continue
          deployment_loaded=1
          echo "Loading deployment ABox seed $$f"
          curl -fsS -u admin:${ADMIN_PASSWORD:-admin} \
               -X POST -H "Content-Type: text/turtle" \
               --data-binary @$$f \
               "$$BASE/data?graph=$${ABOX_GRAPH}"
        done

        if [ "$$deployment_loaded" -eq 0 ]; then
          echo "No deployment ABox seed files found in /staging/kg-ontology/deployment"
        fi
    volumes:
      - ../ARSO_Ontology_AAS_Generation/Ontology:/staging/arso:ro
      - ../kg-bridge/Ontology:/staging/kg-ontology:ro
    restart: "no"
    networks:
      - hivemq-network

  kg-bridge:
    profiles: ["knowledge-graph"]
    build:
      context: ..
      dockerfile: kg-bridge/Dockerfile
    container_name: kg-bridge
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC_PATTERN: ${KG_BRIDGE_TOPIC_PATTERN:-(aas-events|submodel-events)}
      KAFKA_CONSUMER_GROUP: ${KG_BRIDGE_CONSUMER_GROUP:-kg-bridge}
      KAFKA_AUTO_OFFSET_RESET: ${KG_BRIDGE_AUTO_OFFSET_RESET:-earliest}
      FUSEKI_UPDATE_URL: http://kg-fuseki:3030/kg/update
      FUSEKI_QUERY_URL: http://kg-fuseki:3030/kg/sparql
      FUSEKI_USER: admin
      FUSEKI_PASSWORD: ${KG_FUSEKI_ADMIN_PASSWORD:-admin}
      KG_ABOX_GRAPH: ${KG_ABOX_GRAPH:-urn:kg:abox}
      KG_TBOX_GRAPH: ${KG_TBOX_GRAPH:-urn:kg:tbox}
      KG_SHACL_GRAPH: ${KG_SHACL_GRAPH:-urn:kg:shacl}
      AAS_GRAPH: ${KG_ABOX_GRAPH:-urn:kg:abox}
      KG_BASE_NS: ${KG_BASE_NS:-}
      AAS_ID_STRATEGY: ${KG_AAS_ID_STRATEGY:-identity}
      KG_ENABLE_ARSO_APEX_PROJECTION: ${KG_ENABLE_ARSO_APEX_PROJECTION:-true}
      KG_ENABLE_MATERIALIZATION: ${KG_ENABLE_MATERIALIZATION:-true}
      KG_MATERIALIZATION_RULES_DIR: ${KG_MATERIALIZATION_RULES_DIR:-/app/sparql/materialization}
      KG_ENABLE_STRUCTURAL_REASONING: ${KG_ENABLE_STRUCTURAL_REASONING:-false}
      KG_DISABLE_LEGACY_STRUCTURAL_MATERIALIZATION: ${KG_DISABLE_LEGACY_STRUCTURAL_MATERIALIZATION:-false}
      KG_DISABLED_MATERIALIZATION_RULE_PREFIXES: ${KG_DISABLED_MATERIALIZATION_RULE_PREFIXES:-}
      LOG_LEVEL: ${KG_BRIDGE_LOG_LEVEL:-INFO}
    depends_on:
      kafka:
        condition: service_healthy
      fuseki:
        condition: service_healthy
      fuseki-bootstrap:
        condition: service_completed_successfully
    networks:
      - hivemq-network


