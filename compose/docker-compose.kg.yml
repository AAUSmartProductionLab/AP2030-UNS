  akhq:
    profiles: ["knowledge-graph"]
    image: tchiotludo/akhq:${KG_AKHQ_VERSION:-0.25.1}
    container_name: kg-akhq
    restart: unless-stopped
    ports:
      - "${KG_AKHQ_PORT:-8086}:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            ap2030-kafka:
              properties:
                bootstrap.servers: "kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - hivemq-network

  fuseki:
    profiles: ["knowledge-graph"]
    image: stain/jena-fuseki:5.0.0
    container_name: kg-fuseki
    user: "0:0"
    restart: unless-stopped
    ports:
      - "${KG_FUSEKI_PORT:-3030}:3030"
    environment:
      ADMIN_PASSWORD: ${KG_FUSEKI_ADMIN_PASSWORD:-admin}
      JVM_ARGS: -Xmx${KG_FUSEKI_HEAP_MAX:-4G}
    volumes:
      - ../fuseki/databases:/fuseki/databases
      - ../fuseki/configuration:/fuseki/configuration
      - ../ppr-ontology/ontology:/staging/ontology:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3030/$$/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - hivemq-network

  fuseki-bootstrap:
    profiles: ["knowledge-graph"]
    image: curlimages/curl:8.7.1
    container_name: kg-fuseki-bootstrap
    depends_on:
      fuseki:
        condition: service_healthy
    environment:
      ADMIN_PASSWORD: ${KG_FUSEKI_ADMIN_PASSWORD:-admin}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        BASE=http://kg-fuseki:3030/kg
        for f in /staging/ontology/CSS-Ontology.ttl \
                 /staging/ontology/modules/cssx-resource-hierarchy.ttl \
                 /staging/ontology/modules/cssx-predicates.ttl \
                 /staging/ontology/modules/cssx-capabilities.ttl \
                 /staging/ontology/modules/cssx-skills.ttl \
                 /staging/ontology/modules/cssx-ai-planning.ttl \
                 /staging/ontology/modules/cssx-operational-data.ttl \
                 /staging/ontology/modules/cssx-parameters.ttl \
                 /staging/ontology/modules/cssx-bom.ttl \
                 /staging/ontology/modules/cssx-nameplate.ttl \
                 /staging/ontology/modules/cssx-product-hierarchy.ttl \
                 /staging/ontology/modules/cssx-resource-interface.ttl \
                 /staging/ontology/modules/cssx-technical-data.ttl \
                 /staging/ontology/modules/cssx-aas-validation.ttl ; do
          [ -f "$$f" ] || { echo "missing $$f"; continue; }
          echo "Loading $$f"
          curl -fsS -u admin:${ADMIN_PASSWORD:-admin} \
               -X POST -H "Content-Type: text/turtle" \
               --data-binary @$$f \
               "$$BASE/data?graph=default"
        done
    volumes:
      - ../ppr-ontology/ontology:/staging/ontology:ro
    restart: "no"
    networks:
      - hivemq-network

  kg-bridge:
    profiles: ["knowledge-graph"]
    build:
      context: ..
      dockerfile: kg-bridge/Dockerfile
    container_name: kg-bridge
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC_PATTERN: ${KG_BRIDGE_TOPIC_PATTERN:-(aas-events|submodel-events)}
      KAFKA_CONSUMER_GROUP: ${KG_BRIDGE_CONSUMER_GROUP:-kg-bridge}
      KAFKA_AUTO_OFFSET_RESET: ${KG_BRIDGE_AUTO_OFFSET_RESET:-earliest}
      FUSEKI_UPDATE_URL: http://kg-fuseki:3030/kg/update
      FUSEKI_QUERY_URL: http://kg-fuseki:3030/kg/sparql
      FUSEKI_USER: admin
      FUSEKI_PASSWORD: ${KG_FUSEKI_ADMIN_PASSWORD:-admin}
      AAS_GRAPH: urn:kg:aas
      KG_BASE_NS: ${KG_BASE_NS:-urn:kg:aas:}
      AAS_ID_STRATEGY: ${KG_AAS_ID_STRATEGY:-url-encode}
      LOG_LEVEL: ${KG_BRIDGE_LOG_LEVEL:-INFO}
    depends_on:
      kafka:
        condition: service_healthy
      fuseki:
        condition: service_healthy
      fuseki-bootstrap:
        condition: service_completed_successfully
    networks:
      - hivemq-network


