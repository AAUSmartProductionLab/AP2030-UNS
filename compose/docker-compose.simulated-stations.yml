x-station-core-depends: &station-core-depends
  hivemq-broker:
    condition: service_started
  aas-env:
    condition: service_started
  # No dependency on the legacy `databridge` service: the per-unit DMP
  # containers (deployed by dmp-management-node) are the data path now, so a
  # station must not drag the legacy bridge back up.
  registration-service:
    condition: service_healthy

services:
  filling_station:
    extends:
      file: ../simulated_stations/deployment/compose/stations-compose.yml
      service: filling_station
    depends_on: *station-core-depends

  stoppering_station:
    extends:
      file: ../simulated_stations/deployment/compose/stations-compose.yml
      service: stoppering_station
    # Publish the MAIN-stack asset config. The station's built-in default
    # (syntegonStoppering.json) still carries the pre-ADR-022 AID block
    # (retired `interface_mqtt` / `interface_rest`), which the current
    # templates reject with `extra_forbidden`, so registration fails and the
    # repository keeps serving a stale AAS. The e2e stack overrides this with
    # its own variant (see docker-compose.e2e.yml).
    environment:
      STOPPERING_AAS_CONFIG: syntegonStoppering.main.json
    depends_on: *station-core-depends

  load_station:
    extends:
      file: ../simulated_stations/deployment/compose/stations-compose.yml
      service: load_station
    depends_on: *station-core-depends

  unload_station:
    extends:
      file: ../simulated_stations/deployment/compose/stations-compose.yml
      service: unload_station
    depends_on: *station-core-depends

  camera_station:
    extends:
      file: ../simulated_stations/deployment/compose/stations-compose.yml
      service: camera_station
    depends_on: *station-core-depends

  capping_station:
    extends:
      file: ../simulated_stations/deployment/compose/stations-compose.yml
      service: capping_station
    depends_on: *station-core-depends

  planar_table:
    extends:
      file: ../simulated_stations/deployment/compose/stations-compose.yml
      service: planar_table
    depends_on: *station-core-depends

  planar_shuttle1:
    extends:
      file: ../simulated_stations/deployment/compose/stations-compose.yml
      service: planar_shuttle1
    depends_on: *station-core-depends

  planar_shuttle2:
    extends:
      file: ../simulated_stations/deployment/compose/stations-compose.yml
      service: planar_shuttle2
    depends_on: *station-core-depends

  planar_shuttle3:
    extends:
      file: ../simulated_stations/deployment/compose/stations-compose.yml
      service: planar_shuttle3
    depends_on: *station-core-depends