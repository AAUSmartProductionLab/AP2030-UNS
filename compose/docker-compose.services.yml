  production_planner:
    profiles: ["full-stack"]
    extends:
      file: ../Planner/deployment/compose/docker-compose.yaml
      service: production_planner
    networks:
      - hivemq-network
    depends_on:
      hivemq-broker:
        condition: service_started
      aas-env:
        condition: service_started
      dmp:
        condition: service_started
      registration-service:
        condition: service_healthy

  registration-service:
    build:
      context: ../Registration_Service
      dockerfile: Dockerfile
    container_name: registration-service
    environment:
      - PYTHONUNBUFFERED=1
      - MQTT_SCHEMAS_DIR=/app/aas-model/MQTTSchemas
      - BASYX_URL=http://${AAS_SERVER:-aas-env}:${AAS_PORT:-8081}
      - MQTT_BROKER=hivemq-broker
      - MQTT_PORT=1883
      - EXTERNAL_HOST=${EXTERNAL_HOST:-localhost}
      - AAS_SERVER_URL=http://${AAS_SERVER:-aas-env}:${AAS_PORT:-8081}
      - AAS_BASE_URL=https://smartproductionlab.aau.dk
    volumes:
      # AAS configs for registration
      - ../AASDescriptions/Resource/configs:/app/configs:ro
      - ../AASDescriptions/Product/configs:/app/product_configs:ro
      # MQTT Schemas for schema-based message generation
      # The schema set is the aas-model submodule's MQTTSchemas.
      - ../aas-model/MQTTSchemas:/app/MQTTSchemas:ro
    command:
      - python
      - registration-service.py
      - --mqtt-broker
      - hivemq-broker
      - --mqtt-port
      - "1883"
      - --basyx-url
      - http://${AAS_SERVER:-aas-env}:${AAS_PORT:-8081}
      - listen
    restart: unless-stopped
    depends_on:
      hivemq-broker:
        condition: service_started
      aas-env:
        condition: service_started
    healthcheck:
      # The listener has no HTTP endpoint anymore; health = can reach the MQTT broker.
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('hivemq-broker',1883), timeout=3).close()\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - hivemq-network

  dmp:
    image: dmp:java
    # Built locally from the aas-camel-dmp sources (the jar is built in the image).
    build:
      context: ../aas-camel-dmp
    container_name: dmp
    pull_policy: never
    environment:
      - DMP_MANAGED_AAS_REPOSITORY_URI=http://aas-env:8081
      # Repository events: the BaSyx Kafka feature.
      - DMP_MANAGED_EVENT_TRANSPORT=kafka
      - DMP_MANAGED_KAFKA_BROKERS=kafka:9092
      - DMP_MANAGED_CONTROL_TOPIC=submodel-events
      - DMP_MANAGED_CONTROL_GROUP_ID=dmp-java-management
      # Empty scope discovers every AIMC in the repository.
      - DMP_MANAGED_AIMC_IDS=${DMP_MANAGED_AIMC_IDS:-}
      - DMP_MANAGED_MAX_MAPPINGS=${DMP_MANAGED_MAX_MAPPINGS:-4096}
      - DMP_MANAGED_MAX_INVALIDATIONS=${DMP_MANAGED_MAX_INVALIDATIONS:-4096}
      # TimeSeries segments: every segment's Endpoint must name this InfluxDB and org.
      - DMP_INFLUX_URL=http://influxdb:8086
      - DMP_INFLUX_ORG=ap2030
      - DMP_INFLUX_TOKEN=${INFLUX_TOKEN:-ap2030-dev-token}
    ports:
      - "127.0.0.1:${DMP_PORT:-18085}:8080"
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      kafka:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      hivemq-broker:
        condition: service_started
      aas-env:
        # A failed startup scan keeps the DMP degraded and is retried with backoff.
        condition: service_started
    networks:
      - hivemq-network

volumes:
  influxdb-data:
  influxdb-config:
