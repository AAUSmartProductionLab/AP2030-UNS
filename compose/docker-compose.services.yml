services:
  hivemq-broker:
    image: eclipse-mosquitto
    container_name: hivemq-broker
    volumes:
      - ../Mosquitto/config:/mosquitto/config:rw
      - ../Mosquitto/data:/mosquitto/data:rw
      - ../Mosquitto/log:/mosquitto/log:rw
    restart: unless-stopped
    ports:
      - "1883:1883" #default mqtt port
      - "9001:9001" #default mqtt port for websockets
    networks:
      - hivemq-network

  kafka:
    image: confluentinc/cp-kafka:${KAFKA_VERSION:-7.9.1}
    container_name: kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9093}:9093"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INTER_BROKER://kafka:9094,PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9093}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTER_BROKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTER_BROKER://:9094,CONTROLLER://:9095,PLAINTEXT://:9092,EXTERNAL://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTER_BROKER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_BROKER_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9095
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-jmpccZs2RHaYUbZ-LgaIhQ}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_MIN_INSYNC_REPLICAS: 1
      # the BaSyx AAS events carry full submodel bodies (~1.2 MB) — lift the
      # default 1 MB broker ceilings
      KAFKA_MESSAGE_MAX_BYTES: "10485760"
      KAFKA_REPLICA_FETCH_MAX_BYTES: "10485760"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/kafka/9092"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - hivemq-network
  # TimeSeries LinkedSegments (aas-camel-dmp SPEC §5.5). The org and bucket are
  # the ones aas-model authors into every segment (INFLUX_ORG, INFLUX_BUCKET).
  # The DMP writes with the token; the web UI's nginx adds it server-side, so
  # it never reaches a browser. Set INFLUX_TOKEN and INFLUX_PASSWORD outside the lab.
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "127.0.0.1:${INFLUX_PORT:-8086}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-ap2030-influx}
      DOCKER_INFLUXDB_INIT_ORG: ap2030
      DOCKER_INFLUXDB_INIT_BUCKET: ap2030
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-ap2030-dev-token}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - hivemq-network
  frontend:
    build:
      context: ../Configurator
      dockerfile: Dockerfile.frontend
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ../Configurator:/app
      - ../kg-bridge:/kg-bridge:ro
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_MQTT_BROKER_HOST=${EXTERNAL_HOST:-localhost}
      - VITE_MQTT_BROKER_PORT=${MQTT_WS_PORT:-9001}
      - VITE_AAS_REPOSITORY_URL=http://${EXTERNAL_HOST:-localhost}:8081
      - VITE_AAS_SHELL_REGISTRY_URL=http://${EXTERNAL_HOST:-localhost}:8082
    networks:
      - hivemq-network
    depends_on:
      - hivemq-broker
    restart: unless-stopped
    
