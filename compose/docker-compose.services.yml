  production_planner:
    profiles: ["full-stack"]
    extends:
      file: ../Planner/deployment/compose/docker-compose.yaml
      service: production_planner
    networks:
      - hivemq-network
    depends_on:
      hivemq-broker:
        condition: service_started
      aas-env:
        condition: service_started
      databridge:
        condition: service_started
      registration-service:
        condition: service_healthy

  registration-service:
    build:
      context: ../Registration_Service
      dockerfile: Dockerfile
    container_name: registration-service
    environment:
      - PYTHONUNBUFFERED=1
      - BASYX_URL=http://${AAS_SERVER:-aas-env}:${AAS_PORT:-8081}
      - MQTT_BROKER=hivemq-broker
      - MQTT_PORT=1883
      - EXTERNAL_HOST=${EXTERNAL_HOST:-localhost}
      - AAS_SERVER_URL=http://${AAS_SERVER:-aas-env}:${AAS_PORT:-8081}
      - AAS_BASE_URL=https://smartproductionlab.aau.dk
    volumes:
      # AAS configs for registration
      - ../AASDescriptions/Resource/configs:/app/configs:ro
      - ../AASDescriptions/Product/configs:/app/product_configs:ro
      # MQTT Schemas for schema-based message generation
      - ../MQTTSchemas:/app/MQTTSchemas:ro
    command:
      - python
      - registration-service.py
      - --mqtt-broker
      - hivemq-broker
      - --mqtt-port
      - "1883"
      - --basyx-url
      - http://${AAS_SERVER:-aas-env}:${AAS_PORT:-8081}
      - listen
    restart: unless-stopped
    depends_on:
      hivemq-broker:
        condition: service_started
      aas-env:
        condition: service_started
    healthcheck:
      # The listener has no HTTP endpoint anymore; health = can reach the MQTT broker.
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('hivemq-broker',1883), timeout=3).close()\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - hivemq-network