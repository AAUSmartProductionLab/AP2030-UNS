services:
  production_planner:
    build:
      context: ../docker
      dockerfile: production_planner.dockerfile
    container_name: production_planner
    environment:
      - MQTT_BROKER=${MQTT_BROKER:-hivemq-broker}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - AAS_SERVER_URL=${AAS_SERVER_URL:-http://aas-env:8081}
      - AAS_REGISTRY_URL=${AAS_REGISTRY_URL:-http://aas-registry:8080}
      - PRODUCTION_PLANNER_TOPIC=${PRODUCTION_PLANNER_TOPIC:-NN/Nybrovej/InnoLab/ProductionPlanner}
      - REGISTRATION_TOPIC=${REGISTRATION_TOPIC:-NN/Nybrovej/InnoLab/Registration/Config}
      - PYTHONPATH=/app/Planner/third_party/unified-planning:/app
      - PYTHONUNBUFFERED=1
      - METRICS_DIR=/data/run_metrics
      - METRICS_TOPIC_PREFIX=${METRICS_TOPIC_PREFIX:-NN/Nybrovej/InnoLab/Stats}
      - AI_ARTIFACTS_DIR=${AI_ARTIFACTS_DIR:-/data/run_metrics/ai_artifacts}
      - PLANNING_TIMEOUT_SECONDS=${PLANNING_TIMEOUT_SECONDS:-300}
      - STRICT_SEMANTIC_SOLVE=${STRICT_SEMANTIC_SOLVE:-true}
      - PLANNER_INPUT_MODE=${PLANNER_INPUT_MODE:-aas}
      - PLANNER_KG_QUERY_ENDPOINT=${PLANNER_KG_QUERY_ENDPOINT:-http://kg-fuseki:3030/kg/sparql}
      - PLANNER_KG_ABOX_GRAPH=${PLANNER_KG_ABOX_GRAPH:-urn:kg:abox}
      - PLANNER_KG_TBOX_GRAPH=${PLANNER_KG_TBOX_GRAPH:-urn:kg:tbox}
      - PLANNER_KG_QUERY_TIMEOUT_SECONDS=${PLANNER_KG_QUERY_TIMEOUT_SECONDS:-10}
      - PLANNER_KG_CAPABILITY_MATCHING_ENABLED=${PLANNER_KG_CAPABILITY_MATCHING_ENABLED:-true}
      - PLANNER_SHACL_GATE_ENABLED=${PLANNER_SHACL_GATE_ENABLED:-auto}
      - PLANNER_SHACL_QUERY_ENDPOINT=${PLANNER_SHACL_QUERY_ENDPOINT:-http://kg-fuseki:3030/kg/sparql}
      - PLANNER_SHACL_ABOX_GRAPH=${PLANNER_SHACL_ABOX_GRAPH:-urn:kg:abox}
      - PLANNER_SHACL_TBOX_GRAPH=${PLANNER_SHACL_TBOX_GRAPH:-urn:kg:tbox}
      - PLANNER_SHACL_SHAPES_GRAPH=${PLANNER_SHACL_SHAPES_GRAPH:-urn:kg:shacl}
      - PLANNER_SHACL_TIMEOUT_SECONDS=${PLANNER_SHACL_TIMEOUT_SECONDS:-20}
      - PLANNER_SHACL_INFERENCE=${PLANNER_SHACL_INFERENCE:-rdfs}
    volumes:
      - ../../../:/app  # Mount AP2030-UNS repo root
      - ../../../packml_runtime:/app/packml_runtime  # Mount shared PackML runtime
      - ../../../MQTTSchemas:/app/MQTTSchemas  # Overlay schemas
      - ../../../AASDescriptions:/app/AASDescriptions  # Mount AAS configs for registration
      - ../../../run_metrics:/data/run_metrics
    command: ["-m", "Planner.production_planner_service"]
