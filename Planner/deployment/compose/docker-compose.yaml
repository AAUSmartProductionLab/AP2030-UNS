services:
  production_planner:
    build:
      context: ../docker
      dockerfile: production_planner.dockerfile
    container_name: production_planner
    environment:
      - MQTT_BROKER=${MQTT_BROKER:-hivemq-broker}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - PYTHONPATH=/app
      - METRICS_DIR=/data/run_metrics
      - METRICS_TOPIC_PREFIX=${METRICS_TOPIC_PREFIX:-NN/Nybrovej/InnoLab/Stats}
      - BT_SYNTHESIS_TRIVIAL=${BT_SYNTHESIS_TRIVIAL:-}
    volumes:
      - ../../../:/app  # Mount AP2030-UNS repo root
      - ../../../packml_runtime:/app/packml_runtime  # Mount shared PackML runtime
      - ../../../unified-planning:/app/unified-planning  # Mount vendored UP fork
      - ../../../MQTTSchemas:/app/MQTTSchemas  # Overlay schemas
      - ../../../AASDescriptions:/app/AASDescriptions  # Mount AAS configs for registration
      - run_metrics:/data/run_metrics
    command: ["-m", "Planner.production_planner_service"]

volumes:
  run_metrics:
